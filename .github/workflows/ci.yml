name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # T-170: THE gate. Tests run on Windows (the supported platform) and this
  # job is blocking -- pytest is the runtime-correctness evidence the old
  # workflow never collected, and nothing that fails it may reach build.
  tests-windows:
    name: Windows Tests (blocking)
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest ruff==0.16.0

      - name: pytest (full suite)
        run: python -m pytest tests -q

      - name: compileall
        run: python -m compileall saipenview tests

      - name: ruff check
        run: ruff check saipenview/ tests/

      - name: ruff format --check
        run: ruff format --check saipenview/ tests/

      - name: node --check frontend
        run: node --check saipenview/ui/static/app.js

      - name: C0 control-byte hygiene (app.js)
        run: python -m pytest tests/test_test_parser.py::TestSourceHygiene -q

  lint:
    name: Lint & Format (informational)
    runs-on: ubuntu-latest
    # T-170: lint/format are enforced by the blocking tests-windows job; this
    # Linux copy is kept as a faster informational signal but is NOT a gate
    # (continue-on-error stays, matching the typecheck job below).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: ruff check
        run: ruff check saipenview/ tests/

      - name: ruff format check
        run: ruff format --check saipenview/ tests/

  smoke:
    name: Syntax & Import Smoke Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install portable dependencies
        run: |
          pip install --upgrade pip
          pip install keyboard pystray Pillow

      - name: Compile all Python files (syntax check)
        run: python -m compileall saipenview/

      - name: Check core modules import
        run: |
          python - <<'PY'
          import sys, traceback
          sys.path.insert(0, '.')
          REQUIRED = ['saipenview.config', 'saipenview.parser',
                      'saipenview.scanner', 'saipenview.autostart']
          TOLERATED = {'saipenview.autostart': ('winreg',)}
          failed = []
          for m in REQUIRED:
              try:
                  __import__(m)
                  print(f'  OK: {m}')
              except ImportError as e:
                  missing = getattr(e, 'name', '') or str(e)
                  if any(t in str(missing) for t in TOLERATED.get(m, ())):
                      print(f'  SKIP (platform-only dep {missing}): {m}')
                      continue
                  failed.append((m, traceback.format_exc()))
              except Exception:
                  failed.append((m, traceback.format_exc()))
          if failed:
              for m, tb in failed:
                  print(f'  FAIL: {m}', file=sys.stderr)
                  print(tb, file=sys.stderr)
              sys.exit(1)
          print('Module import check complete.')
          PY

      - name: Check HTML & JS syntax
        run: |
          node --check saipenview/ui/static/app.js
          python -c "import html.parser; html.parser.HTMLParser().feed(open('saipenview/ui/static/index.html', encoding='utf-8').read()); print('HTML parse: OK')"

  typecheck:
    name: Type Check (mypy, informational)
    runs-on: ubuntu-latest
    # T-170: mypy stays informational and is deliberately NOT named a release
    # gate -- it has never been green and runtime correctness is proven by the
    # blocking tests-windows job. Never wire this into `build`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install keyboard pystray Pillow
          pip install mypy

      - name: Run mypy
        run: mypy --ignore-missing-imports --python-version 3.11 saipenview/

  build:
    name: Build + Verify Wheel
    runs-on: ubuntu-latest
    # T-170: the build depends on the BLOCKING tests (Windows runtime proof),
    # not just the Linux smoke. lint/typecheck are informational and never
    # gate a release.
    needs: [smoke, tests-windows]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build + verify deps
        run: pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel exists
        run: |
          ls -la dist/
          echo "Wheel built: $(ls dist/*.whl | head -1)"

      - name: Verify version triple + installed-wheel smoke
        run: |
          python - <<'PY'
          import re, subprocess, sys, tempfile, zipfile
          from pathlib import Path
          wheel = sorted(Path('dist').glob('*.whl'))[0]
          with zipfile.ZipFile(wheel) as z:
              meta = z.read(next(n for n in z.namelist() if n.endswith('.dist-info/METADATA'))).decode()
          meta_ver = re.search(r'^Version:\s*(.+)$', meta, re.M).group(1).strip()
          pyproj_ver = re.search(r'^version\s*=\s*"([^"]+)"', Path('pyproject.toml').read_text(), re.M).group(1)
          with tempfile.TemporaryDirectory() as td:
              subprocess.run([sys.executable, '-m', 'pip', 'install', '--quiet', '--no-deps',
                              '--target', td, str(wheel)], check=True)
              sys.path.insert(0, td)
              import saipenview
              pkg_ver = saipenview.__version__
              assert pyproj_ver == meta_ver == pkg_ver, (pyproj_ver, meta_ver, pkg_ver)
              assert saipenview.__file__.startswith(td), saipenview.__file__
              import saipenview.config, saipenview.parser, saipenview.paths
          print(f'wheel verify PASS: {pyproj_ver} == {meta_ver} == {pkg_ver}, installed smoke clean')
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ github.sha }}
          path: dist/*.whl
          retention-days: 7

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Version PINNED on purpose: an unpinned linter makes CI
      # nondeterministic -- a new ruff release changes the default rule set
      # and turns the build red with no code change at all. Bump deliberately,
      # together with [tool.ruff] in pyproject.toml.
      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: ruff check
        run: ruff check saipenview/

      - name: ruff format check
        run: ruff format --check saipenview/

  smoke:
    name: Syntax & Import Smoke Test
    runs-on: ubuntu-latest
    # No continue-on-error: a gate that cannot fail is not a gate. This job
    # previously could not report a problem no matter what broke.
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install portable dependencies
        run: |
          pip install --upgrade pip
          # Install only the dependencies that work on Linux.
          # pywebview is Windows-only (WebView2/Gtk backend);
          # keyboard also has Linux support so it's included.
          pip install keyboard pystray Pillow

      - name: Compile all Python files (syntax check)
        run: python -m compileall saipenview/

      - name: Check core modules import
        run: |
          python - <<'PY'
          import sys, traceback
          sys.path.insert(0, '.')
          # Modules that must import on a bare Linux runner. pywebview/tray are
          # excluded on purpose -- they need Windows/GTK backends.
          REQUIRED = ['saipenview.config', 'saipenview.parser',
                      'saipenview.scanner', 'saipenview.autostart']
          # autostart imports winreg (Windows-only) -- tolerated, but ONLY that.
          TOLERATED = {'saipenview.autostart': ('winreg',)}
          failed = []
          for m in REQUIRED:
              try:
                  __import__(m)
                  print(f'  OK: {m}')
              except ImportError as e:
                  missing = getattr(e, 'name', '') or str(e)
                  if any(t in str(missing) for t in TOLERATED.get(m, ())):
                      print(f'  SKIP (platform-only dep {missing}): {m}')
                      continue
                  failed.append((m, traceback.format_exc()))
              except Exception:
                  failed.append((m, traceback.format_exc()))
          if failed:
              for m, tb in failed:
                  print(f'  FAIL: {m}', file=sys.stderr)
                  print(tb, file=sys.stderr)
              sys.exit(1)
          print('Module import check complete.')
          PY

      - name: Check HTML & JS syntax
        run: |
          node --check saipenview/ui/static/app.js
          python -c "import html.parser; html.parser.HTMLParser().feed(open('saipenview/ui/static/index.html', encoding='utf-8').read()); print('HTML parse: OK')"

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install keyboard pystray Pillow
          pip install mypy

      - name: Run mypy
        run: mypy --ignore-missing-imports --python-version 3.11 saipenview/

  build:
    name: Build Wheel
    runs-on: ubuntu-latest
    needs: [lint, smoke]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel exists
        run: |
          ls -la dist/
          echo "Wheel built: $(ls dist/*.whl | head -1)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ github.sha }}
          path: dist/*.whl
          retention-days: 7

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "saipenview"
# ONE version source (T-188): `saipenview/__init__.py` is the canonical value,
# derived here at build time. A static copy previously lagged the tags
# (v0.1.18..v0.1.20 shipped with pyproject still at 0.1.17), so a wheel could
# lie about which release it was.
dynamic = ["version"]
description = "Desktop tray viewer for SAIPEN projects — live dashboard with vintage Win95 aesthetic"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["saipen", "dashboard", "tray", "project-management", "ai-agents"]
authors = [
  {name = "SAIPENVIEW Contributors"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment :: Window Managers",
  "Topic :: Software Development :: Version Control",
]
dependencies = [
    "pystray>=0.19",
    "keyboard>=0.13",
    "pywebview>=5.0",
    "Pillow>=10.0",
    "watchdog>=4.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
# Build/dev dependencies live in an extra, not in the runtime `dependencies`
# floor (T-189). requirements.txt mirrors the runtime floor for the run.bat
# install path and adds nuitka for tools/build.py.
dev = ["nuitka>=2.0.0"]

[tool.setuptools.dynamic]
version = {attr = "saipenview.__version__"}

[project.urls]
Homepage = "https://github.com/vacterro/saipenview"
Repository = "https://github.com/vacterro/saipenview"
Issues = "https://github.com/vacterro/saipenview/issues"

[project.scripts]
saipenview = "saipenview.__main__:main"

[tool.setuptools.packages.find]
include = ["saipenview*"]

[tool.setuptools.package-data]
saipenview = ["ui/static/*", "assets/*", "assets/themes/*.json"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# EXPLICIT select, deliberately not ruff's defaults. Without this the rule set
# is whatever the ruff release installed that day happens to enable, so a new
# ruff version turns CI red with zero code changes -- which is exactly what
# happened here (46 findings appeared on an untouched codebase).
# CI pins the ruff version too; both halves are needed.
select = [
    "E4", "E7", "E9",  # pycodestyle: real errors only, not line-length noise
    "F",               # pyflakes: undefined names, unused imports
    "I",               # import sorting
    "UP",              # pyupgrade: keep syntax current with target-version
    "B",               # bugbear: genuine footguns
    "PIE",             # misc correctness
    "S",               # bandit security checks
]
ignore = [
    # Blind `except Exception` is a DELIBERATE design choice here, not an
    # oversight. This is a desktop tray app: a failure in one project's parse,
    # one geometry call or one OS integration must degrade that one thing and
    # never kill the scan thread or the UI. Every such handler logs to stderr
    # (see T-027) rather than swallowing. Narrowing them would mean guessing
    # the full exception surface of ctypes/WinForms/pywebview/keyboard, and
    # guessing wrong there is how the silent-death bugs T-038/T-060 happened.
    "BLE001",
    # `dir_count` drives the scan I/O throttle (T-001). enumerate() would work
    # but shifts the counter's base and touches carefully tuned pacing for a
    # pure style win -- not worth the regression risk.
    "SIM113",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff.lint.per-file-ignores]
# subprocess calls here are list-form with no shell=True; the paths come from
# the user's own config/picker, not from network input.
"saipenview/api.py" = ["S603", "S607"]
"saipenview/parser.py" = ["S603", "S607"]
"saipenview/git_diff.py" = ["S603", "S607"]
"saipenview/runtime.py" = ["S603", "S607"]
"tools/build.py" = ["S603"]
# tools/verify_wheel.py and tools/export_source.py drive git/build/pip with
# controlled local arguments (git archive of HEAD, python -m build, pip
# install of the freshly built wheel) -- list-form, no shell.
"tools/verify_wheel.py" = ["S603", "S607"]
"tools/export_source.py" = ["S603", "S607"]
"tools/release_gate.py" = ["S603", "S607"]
# Test files use `assert` extensively (standard pytest pattern); bandit's
# S101 warning is noise here. The git tests (tests/test_git_diff.py) invoke
# the real git CLI against a temporary fixture repo -- list-form, no shell,
# fully test-controlled input.
"tests/*" = ["S101", "S108", "SIM113", "S603", "S607"]
